<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">CV inference on Kubernetes</title>
  <desc id="desc">Image upload flows through FastAPI to a model service, with Kubernetes autoscaling and Prometheus and Grafana monitoring.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#07142d"/><stop offset="1" stop-color="#102f67"/></linearGradient>
    <linearGradient id="card" x1="0" x2="1"><stop offset="0" stop-color="#123b82"/><stop offset="1" stop-color="#1767b8"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#020817" flood-opacity=".5"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#58d8ff"/></marker>
  </defs>
  <rect width="1200" height="420" rx="24" fill="url(#bg)"/>
  <circle cx="1060" cy="70" r="120" fill="#147ee8" opacity=".14"/>
  <circle cx="160" cy="360" r="150" fill="#00d9ff" opacity=".08"/>
  <text x="60" y="65" fill="#fff" font-family="Arial, sans-serif" font-size="32" font-weight="700">CV INFERENCE ON KUBERNETES</text>
  <text x="60" y="94" fill="#9bdcff" font-family="Arial, sans-serif" font-size="16">Production-oriented real-time image classification platform</text>
  <g filter="url(#shadow)">
    <rect x="60" y="150" width="220" height="150" rx="18" fill="url(#card)" stroke="#57d7ff" stroke-width="2"/>
    <rect x="340" y="150" width="220" height="150" rx="18" fill="url(#card)" stroke="#57d7ff" stroke-width="2"/>
    <rect x="620" y="150" width="220" height="150" rx="18" fill="url(#card)" stroke="#57d7ff" stroke-width="2"/>
    <rect x="900" y="150" width="240" height="150" rx="18" fill="url(#card)" stroke="#57d7ff" stroke-width="2"/>
  </g>
  <g fill="#fff" font-family="Arial, sans-serif" text-anchor="middle">
    <text x="170" y="195" font-size="20" font-weight="700">1. INPUT</text><text x="170" y="235" font-size="17">Upload image</text><text x="170" y="265" font-size="14" fill="#bcecff">64×64 RGB PNG</text>
    <text x="450" y="195" font-size="20" font-weight="700">2. FASTAPI</text><text x="450" y="235" font-size="17">Validated request</text><text x="450" y="265" font-size="14" fill="#bcecff">Auth · limits · metrics</text>
    <text x="730" y="195" font-size="20" font-weight="700">3. MODEL</text><text x="730" y="235" font-size="17">ShapeCNN inference</text><text x="730" y="265" font-size="14" fill="#bcecff">Circle · square · triangle · star</text>
    <text x="1020" y="195" font-size="20" font-weight="700">4. PLATFORM</text><text x="1020" y="235" font-size="17">Kubernetes + HPA</text><text x="1020" y="265" font-size="14" fill="#bcecff">Prometheus · Grafana</text>
  </g>
  <g stroke="#58d8ff" stroke-width="4" fill="none" marker-end="url(#arrow)"><path d="M285 225 H330"/><path d="M565 225 H610"/><path d="M845 225 H890"/></g>
  <text x="600" y="365" fill="#bcecff" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">Containerized · observable · horizontally scalable · security-hardened</text>
</svg>
