# Prometheus scrape config for the CV inference service.
#
# Two scrape jobs:
#   - cv-inference-local: static target, used by docker-compose.yml.
#   - cv-inference-k8s: kubernetes_sd_configs pod-based discovery, used
#     when Prometheus runs inside the cluster. Relies on the
#     prometheus.io/scrape, prometheus.io/path, prometheus.io/port
#     annotations on the Deployment's pod template (k8s/deployment.yaml),
#     so it automatically picks up new pods as HPA scales the deployment.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "cv-inference-local"
    static_configs:
      - targets: ["api:8000"]

  - job_name: "cv-inference-k8s"
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: "true"
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_pod_label_app]
        target_label: app
