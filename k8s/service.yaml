apiVersion: v1
kind: Service
metadata:
  name: cv-inference
  labels:
    app: cv-inference
spec:
  selector:
    app: cv-inference
  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: cv-inference-external
  labels:
    app: cv-inference
spec:
  selector:
    app: cv-inference
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      nodePort: 30080
      protocol: TCP
  type: NodePort
