name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install ruff
      - run: ruff check src/ tests/

  test:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install torch (CPU-only)
        run: pip install --index-url https://download.pytorch.org/whl/cpu torch==2.13.0
      - run: pip install -r requirements-dev.txt
      - name: Unit tests (fast, no trained model needed)
        run: pytest tests/ -v
      - name: Generate data + train + sanity-check accuracy
        run: |
          python src/generate_data.py
          python -m src.train --epochs 8
      - name: Build clean Docker image
        run: docker build --tag cv-inference-api:ci .
      - name: Validate Compose configuration
        env:
          GRAFANA_ADMIN_PASSWORD: ci-validation-password
        run: docker compose config --quiet
      - name: Validate Kubernetes manifests against the real API schema
        run: |
          pip install kubernetes
          python - <<'EOF'
          import yaml
          from kubernetes import client
          api = client.ApiClient()
          with open('k8s/deployment.yaml') as f:
              api._ApiClient__deserialize(yaml.safe_load(f), client.V1Deployment)
          with open('k8s/hpa.yaml') as f:
              api._ApiClient__deserialize(yaml.safe_load(f), client.V2HorizontalPodAutoscaler)
          with open('k8s/service.yaml') as f:
              for doc in yaml.safe_load_all(f):
                  api._ApiClient__deserialize(doc, client.V1Service)
          with open('k8s/serviceaccount.yaml') as f:
              api._ApiClient__deserialize(yaml.safe_load(f), client.V1ServiceAccount)
          with open('k8s/pdb.yaml') as f:
              api._ApiClient__deserialize(yaml.safe_load(f), client.V1PodDisruptionBudget)
          with open('k8s/networkpolicy.yaml') as f:
              api._ApiClient__deserialize(yaml.safe_load(f), client.V1NetworkPolicy)
          print("All manifests structurally valid")
          EOF

  # Applying Kubernetes resources and observing HPA behavior remains an
  # environment-level verification step requiring a real cluster.

  image:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Scan image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
