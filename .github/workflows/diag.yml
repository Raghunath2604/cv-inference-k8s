name: CI Diagnostic

on:
  push:
    branches: [ main ]

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python info
        run: |
          python -V
          python -c "import sys; print(sys.executable)"
          pip --version
      - name: Install torch (verbose)
        run: |
          python -m pip install --upgrade pip
          pip install -v --index-url https://download.pytorch.org/whl/cpu torch==2.13.0 || true
          pip show torch || true
          python -c "import importlib,sys
try:
    import torch
    print('torch', torch.__version__)
except Exception as e:
    print('torch import failed:', e)
    sys.exit(0)"
